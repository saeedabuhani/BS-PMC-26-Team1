    <div class="container">
        
          
        

        
<div class="module-header">
    <h1>Edit Question</h1>
    <p class="subtitle">Manage the question bank with full metadata and answer details.</p>
</div>

<div class="ds-card" style="max-width: 820px; margin: 0 auto;">
    <form method="POST" class="ds-flex-col" style="gap: var(--ds-space-4);">
        <input type="hidden" name="csrf_token" value="demo">
        <div>
            <label for="question_text">Question Text</label>
            <textarea id="question_text" name="question_text" rows="4" required="">What does an artifact repository do in a CI/CD pipeline?</textarea>
        </div>

        <div class="ds-row">
            <div style="flex: 1; min-width: 180px;">
                <label for="question_type">Type</label>
                <select name="question_type" id="question_type">
                    
                    <option value="mcq" selected="">MCQ</option>
                    <option value="code">CODE</option>
                    <option value="open">OPEN</option>
                </select>
            </div>
            <div style="flex: 1; min-width: 180px;">
                <label for="difficulty">Difficulty</label>
                
                <select id="difficulty" name="difficulty">
                    <option value="easy">Easy</option>
                    <option value="medium" selected="">Medium</option>
                    <option value="hard">Hard</option>
                </select>
            </div>
            <div style="flex: 1; min-width: 180px;">
                <label for="module_id">Module</label>
                
                <select id="module_id" name="module_id" required="">
                    
                    <option value="1">Intro</option>
                    
                    <option value="2">Pipeline</option>
                    
                    <option value="3" selected="">Exercise</option>
                    
                </select>
            </div>
        </div>

        <div>
            <label for="correct_answer">Correct Answer</label>
            <input id="correct_answer" type="text" name="correct_answer" required="" value="Stores versioned build outputs for downstream deployment">
        </div>

        <div>
            <label for="explanation">Explanation</label>
            <textarea id="explanation" name="explanation" rows="3" required="">Artifact repositories keep deployable outputs versioned and available for promotion across environments.</textarea>
        </div>

        <div>
            <label for="options">MCQ Options (one option per line)</label>
            <textarea id="options" name="options" rows="4">Runs developer interviews
Stores versioned build outputs for downstream deployment
Replaces the source code repository</textarea>
        </div>

        <div>
            <label for="starter_code">Starter Code (for CODE type)</label>
            <textarea id="starter_code" name="starter_code" style="display:none;">None</textarea>
            <div id="starterCodeWrapper" style="border-radius: var(--ds-radius-input); border: 1px solid var(--ds-border-strong); overflow: hidden; background:#1e1e1e;">
                <div style="display:flex; justify-content:space-between; align-items:center; padding: 8px 14px; background:#252526; border-bottom:1px solid #333; font-family: monospace; font-size:13px; color:#cccccc;">
                    <span>● starter_code.py</span>
                    <span style="opacity:0.7;">Python</span>
                </div>
                <div id="starterCodeEditor" style="height: 220px; width: 100%;"></div>
            </div>
        </div>

        <div>
            <label for="test_cases_json">Test Cases JSON (for CODE type)</label>
            <textarea id="test_cases_json" name="test_cases_json" style="display:none;">None</textarea>
            <div id="testCasesWrapper" style="border-radius: var(--ds-radius-input); border: 1px solid var(--ds-border-strong); overflow: hidden; background:#1e1e1e;">
                <div style="display:flex; justify-content:space-between; align-items:center; padding: 8px 14px; background:#252526; border-bottom:1px solid #333; font-family: monospace; font-size:13px; color:#cccccc;">
                    <span>● test_cases.json</span>
                    <span style="opacity:0.7;">JSON</span>
                </div>
                <div id="testCasesEditor" style="height: 180px; width: 100%;"></div>
            </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.46.0/min/vs/loader.js"></script>
        <script>
        (function () {
            const starterValue = null;
            const testCasesValue = null;

            require.config({ paths: { vs: 'https://cdn.jsdelivr.net/npm/monaco-editor@0.46.0/min/vs' } });
            require(['vs/editor/editor.main'], function () {
                const starter = monaco.editor.create(document.getElementById('starterCodeEditor'), {
                    value: starterValue || '# Provide starter code for the student\n',
                    language: 'python',
                    theme: 'vs-dark',
                    automaticLayout: true,
                    fontSize: 14,
                    minimap: { enabled: false },
                    scrollBeyondLastLine: false,
                    tabSize: 4
                });
                starter.onDidChangeModelContent(() => {
                    document.getElementById('starter_code').value = starter.getValue();
                });
                document.getElementById('starter_code').value = starter.getValue();

                const cases = monaco.editor.create(document.getElementById('testCasesEditor'), {
                    value: testCasesValue || '[\n  { "inputs": [2, 3], "expected": 5 }\n]',
                    language: 'json',
                    theme: 'vs-dark',
                    automaticLayout: true,
                    fontSize: 14,
                    minimap: { enabled: false },
                    scrollBeyondLastLine: false,
                    tabSize: 2
                });
                cases.onDidChangeModelContent(() => {
                    document.getElementById('test_cases_json').value = cases.getValue();
                });
                document.getElementById('test_cases_json').value = cases.getValue();
            });
        })();
        </script>

        
        <div class="ds-flex ds-items-center ds-gap-2">
            <input type="checkbox" id="is_active" name="is_active" checked="" style="width:auto; margin:0; accent-color: var(--ds-primary);">
            <label for="is_active" style="margin: 0;">Active Question</label>
        </div>
        

        <div class="ds-flex ds-gap-4" style="flex-wrap: wrap;">
            <button class="ds-btn ds-btn-primary" type="submit">Save Changes</button>
            <a href="/lecturer/questions" class="ds-btn ds-btn-outline">Cancel</a>
        </div>
    </form>
</div>

<script src="/BS-PMC-26-Team1/demo.js"></script></body></html>

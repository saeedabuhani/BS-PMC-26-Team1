<div class="module-header">
    <h1>Edit Pipeline Theory</h1>
    <p class="subtitle">Keep explanations and examples aligned with current DevOps teaching.</p>
</div>

<div class="ds-card" style="max-width: 920px; margin: 0 auto;">
    <form method="POST" class="ds-flex-col" style="gap: var(--ds-space-4);">
        <input type="hidden" name="csrf_token" value="demo">
        <div>
            <label for="theory-headline">Headline</label>
            <input id="theory-headline" type="text" name="headline" required="" value="Pipeline Stages in Practice">
        </div>

        <div>
            <label for="theory-explanation">Explanation</label>
            <textarea id="theory-explanation" name="explanation" rows="6" required="">A pipeline is the contract between development and operations. Each stage – Code, Build, Test, Deploy – validates the artifact a little further. Strong pipelines are reproducible, observable, and reversible: if anything fails, the team should learn fast and roll back quickly.</textarea>
        </div>

        <div>
            <label for="theory-examples">Examples</label>
            <textarea id="theory-examples" name="examples" rows="5" required="">Example 1: Code commit triggers a unit-test pipeline run.
Example 2: Build packages the app into a Docker image.
Example 3: Test stage runs integration suites with seed data.
Example 4: Deploy promotes the image to staging and then production after approval.</textarea>
        </div>

        <div class="ds-flex ds-gap-4" style="flex-wrap: wrap;">
            <button class="ds-btn ds-btn-primary" type="submit">Save Theory Update</button>
            <a href="/lecturer/theory" class="ds-btn ds-btn-outline">Back</a>
        </div>
    </form>
</div>

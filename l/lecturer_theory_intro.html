<div class="module-header">
    <h1>Edit Intro Theory</h1>
    <p class="subtitle">Keep explanations and examples aligned with current DevOps teaching.</p>
</div>

<div class="ds-card" style="max-width: 920px; margin: 0 auto;">
    <form method="POST" class="ds-flex-col" style="gap: var(--ds-space-4);">
        <input type="hidden" name="csrf_token" value="demo">
        <div>
            <label for="theory-headline">Headline</label>
            <input id="theory-headline" type="text" name="headline" required="" value="CI/CD Foundations">
        </div>

        <div>
            <label for="theory-explanation">Explanation</label>
            <textarea id="theory-explanation" name="explanation" rows="6" required="">CI/CD is the backbone of modern software delivery. It combines disciplined version control, automated testing, and reliable deployment to keep features flowing safely from developer laptops to production systems. Teams adopt it to reduce risk, accelerate feedback, and increase confidence in every change.</textarea>
        </div>

        <div>
            <label for="theory-examples">Examples</label>
            <textarea id="theory-examples" name="examples" rows="5" required="">Example 1: A small feature branch is merged automatically after green tests. 
Example 2: A failed lint check blocks the merge until fixed.
Example 3: A nightly build publishes a release candidate to staging for review.</textarea>
        </div>

        <div class="ds-flex ds-gap-4" style="flex-wrap: wrap;">
            <button class="ds-btn ds-btn-primary" type="submit">Save Theory Update</button>
            <a href="/lecturer/theory" class="ds-btn ds-btn-outline">Back</a>
        </div>
    </form>
</div>

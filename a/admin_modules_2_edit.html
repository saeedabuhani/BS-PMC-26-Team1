    <div class="container">
        
          
        

        

<div class="module-header">
    <h1>Edit Module</h1>
    <p class="subtitle">Modules drive the learning path order and navigation.</p>
</div>

<div class="ds-card" style="max-width: 720px; margin: 0 auto;">
    <form method="POST" class="ds-flex-col" style="gap: var(--ds-space-4);">
        <input type="hidden" name="csrf_token" value="demo">
        <div>
            <label for="module-name">Name</label>
            <input id="module-name" type="text" name="name" required="" maxlength="120" value="Pipeline">
        </div>
        <div>
            <label for="module-description">Description</label>
            <textarea id="module-description" name="description" rows="4" required="" maxlength="1000">Interactive CI/CD pipeline stages.</textarea>
        </div>
        <div class="ds-row">
            <div style="flex:1; min-width: 200px;">
                <label for="module-route">Route (must start with /)</label>
                <input id="module-route" type="text" name="route" required="" maxlength="120" value="/pipeline">
            </div>
            <div style="flex:0 0 200px;">
                <label for="module-order">Display order</label>
                <input id="module-order" type="number" name="display_order" min="1" max="999" value="2">
            </div>
        </div>
        <div class="ds-flex ds-gap-4" style="flex-wrap: wrap;">
            <button type="submit" class="ds-btn ds-btn-primary">Save changes</button>
            <a href="/admin/modules" class="ds-btn ds-btn-outline">Cancel</a>
        </div>
    </form>
</div>

    </div>

<script src="/BS-PMC-26-Team1/demo.js"></script></body></html>

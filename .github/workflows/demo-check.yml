name: Demo check

# Opens the published static demo in a real browser and runs the smoke test in scripts/check_demo.cjs.
on:
  workflow_dispatch:
  push:
    branches: [portfolio-polish, gh-pages]
    paths:
      - .github/workflows/demo-check.yml
      - scripts/check_demo.cjs
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: portfolio-polish
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: node scripts/check_demo.cjs https://saeedabuhani.github.io/BS-PMC-26-Team1 shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: demo-screenshots
          path: shots
